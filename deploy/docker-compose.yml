services:
  frontend-app:
    image: ${IMAGE}:${TAG}
    container_name: frontend-app
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [web]

networks:
  web:
    name: web # shared with backend app